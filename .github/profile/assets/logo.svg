<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b12" />
      <stop offset="50%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- Cyber Neon Glows -->
    <linearGradient id="primary-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="2" y="2" rx="38" fill="none" stroke="url(#primary-neon)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Constellation Circuit Nodes -->
  <g stroke="#818cf8" stroke-width="1" stroke-opacity="0.25">
    <line x1="60" y1="90" x2="140" y2="70" />
    <line x1="140" y1="70" x2="200" y2="120" />
    <line x1="380" y1="90" x2="430" y2="150" />
    <line x1="430" y1="150" x2="410" y2="230" />
    <line x1="70" y1="360" x2="120" y2="410" />
    <line x1="370" y1="410" x2="440" y2="350" />
  </g>
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="60" cy="90" r="3" />
    <circle cx="140" cy="70" r="3.5" />
    <circle cx="200" cy="120" r="2.5" />
    <circle cx="380" cy="90" r="3" />
    <circle cx="430" cy="150" r="3.5" />
    <circle cx="70" cy="360" r="3" />
    <circle cx="440" cy="350" r="3" />
  </g>

  <!-- Cyber Wolf Head Geometry -->
  <g transform="translate(40, -10)" filter="url(#neon-glow)">
    <!-- Ears & Crown -->
    <polygon points="260,80 300,140 240,130" fill="none" stroke="url(#primary-neon)" stroke-width="3.5" stroke-linejoin="round" />
    <polygon points="320,100 350,155 305,145" fill="none" stroke="url(#accent-cyan)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Snout & Jaw -->
    <polyline points="300,140 370,180 395,210 355,225 320,205 270,220" fill="none" stroke="url(#primary-neon)" stroke-width="3.5" stroke-linejoin="round" />
    <polyline points="370,180 350,195 325,185" fill="none" stroke="url(#accent-cyan)" stroke-width="2" />
    
    <!-- Eye -->
    <polygon points="310,165 330,170 315,176" fill="#38bdf8" />

    <!-- Circuit Cheeks -->
    <polyline points="240,130 220,175 255,210 240,245 285,250" fill="none" stroke="url(#primary-neon)" stroke-width="2.5" />
    <circle cx="220" cy="175" r="4" fill="#c084fc" />
    <circle cx="255" cy="210" r="3" fill="#38bdf8" />
  </g>

  <!-- Monogram: HR -->
  <g transform="translate(65, 170)" filter="url(#neon-glow)">
    <!-- Letter H -->
    <path d="M 50 120 L 75 40 L 105 40 L 92 82 L 138 82 L 151 40 L 181 40 L 144 160 L 114 160 L 126 120 Z" fill="url(#primary-neon)" />
    
    <!-- Letter R -->
    <path d="M 180 160 L 217 40 L 275 40 C 305 40, 320 55, 314 78 C 309 98, 292 110, 268 114 L 295 160 L 262 160 L 238 118 L 212 118 L 199 160 Z M 221 92 L 255 92 C 268 92, 277 87, 280 77 C 283 67, 276 62, 263 62 L 230 62 Z" fill="url(#primary-neon)" />
  </g>

  <!-- Organization Wordmark: HanRkz -->
  <text x="250" y="395" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="4">
    HanRkz
  </text>
  
  <text x="250" y="425" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#818cf8" letter-spacing="6">
    TECH ORGANIZATION
  </text>
</svg>
